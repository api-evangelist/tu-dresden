  - date: '2026-06-03'
    rating: 2
    summary: >-
      TU Dresden has a modest but real public API footprint. Verified live: a
      gated lecture-catalog JSON API (vvz.phil, account + auth_code required,
      10s rate limit), the ZIH Shibboleth SAML SSO IdP with public docs and
      metadata, the OpARA research-data repository, and the Qucosa document
      server which returns a valid OAI-PMH Identify response. The SLUB Dresden
      Linked Open Data API (serving the university, separate library
      institution) is documented with a Swagger UI and an Apache-2.0 GitHub
      repo. The official github.com/tu-dresden org exists but is essentially
      inactive (1 stale repo from 2015). No fabricated endpoints; only URLs
      confirmed via live HTTP probes are listed. Rating reflects limited,
      mostly-gated developer-facing API maturity.
