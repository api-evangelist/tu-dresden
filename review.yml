reviews:
  - date: '2026-08-30'
    rating: 3
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES a
      surface before crediting it. The June 2026 profile's five OpenAPI contracts were one
      document — the SLUB Dresden Linked Open Data API at data.slub-dresden.de, split by tag into
      five apparent surfaces — and every apis[] entry for them carried a baseURL of
      vvz.phil.tu-dresden.de, a host those specs never name, which is why a hostname-based audit
      read them as institution-owned. SLUB is a separate Saxon state institution with its own
      Crossref membership (26325) and its own DataCite provider symbol (TBYU). Those contracts and
      the twenty-two artifacts derived from them were removed by name. What replaced them is more,
      not less: TUD:AI at llm.scads.ai/v1, an OpenAI-compatible LLM inference API operated by ZIH
      and ScaDS.AI on TU Dresden's own IP space with keys issued from the university Self-Service
      Portal; OPARA's DSpace 7.6.2 REST API and OAI-PMH interface, which TU Dresden operates for
      four Saxon institutions; and the university's own Shibboleth IdP, which now serves OpenID
      Connect discovery and a JWKS — correcting the June profile's claim that OIDC was "planned
      but not yet available". Four of twelve education-regime domain standards conform, all four
      institution-operated. Two tenancies recorded honestly: Elsevier Pure at fis.tu-dresden.de
      and the SLUB-run Qucosa view at tud.qucosa.de. TU Dresden publishes no OpenAPI of its own
      and none was authored here.
