description: >-
  Technische Universität Dresden (TUD) is a German public technical university in Dresden, Saxony,
  a member of TU9 and one of the institutions funded under the German Universities Excellence
  Strategy. Re-profiled on 2026-08-30 under the API Evangelist university pipeline, which settles
  WHO OPERATES a surface before crediting it to the institution. The June 2026 profile credited TU
  Dresden with five OpenAPI contracts and five extra apis[] entries; all five were one document —
  the Linked Open Data API of the Sächsische Landesbibliothek – Staats- und Universitätsbibliothek
  Dresden (SLUB), a separate Saxon state institution, served from data.slub-dresden.de and split
  by tag into five apparent surfaces. Worse, every one of those entries carried a baseURL of
  vvz.phil.tu-dresden.de, a host the specs never mention, which is why a hostname-based audit read
  them as institution-owned. Those contracts and the twenty-two schema, structure, JSON-LD,
  vocabulary, ruleset, example, collection and agentic-access artifacts derived from them have
  been removed. What is left is what TU Dresden actually runs, and it is more than the old profile
  showed. The headline find is TUD:AI at llm.scads.ai/v1 — an OpenAI-compatible LLM inference API
  operated by ZIH and ScaDS.AI Dresden/Leipzig on TU Dresden's own network, keyed from the
  university's Self-Service Portal, serving nine open-weight chat models plus embedding, audio and
  image endpoints. Alongside it: OPARA, the DSpace 7.6.2 research-data repository TU Dresden
  operates for four Saxon institutions, with an open REST API and an OAI-PMH interface; the
  university's own Shibboleth identity provider, registered in DFN-AAI and exported to eduGAIN,
  which now also serves OpenID Connect discovery and a JWKS; and the gated lecture-directory JSON
  API of the Faculty of Arts. Two surfaces are real institutional facts running on somebody else's
  engineering: the Pure-based research information system at fis.tu-dresden.de and the TU Dresden
  view of the SLUB-operated Qucosa document server. TU Dresden publishes no OpenAPI of its own, no
  developer portal, no open data portal and no llms.txt — but it does publish a security.txt, and
  it holds its own DataCite membership and DOI prefix.
