- aid: tu-dresden:lecture-catalog
  name: TU Dresden Lecture Catalog API (Vorlesungsverzeichnis)
  x-operator: institution
  x-operator-evidence: >-
    vvz.phil.tu-dresden.de is under the university's own registrable domain and is run by the
    Faculty of Arts, Humanities and Social Sciences. The documentation page is authored in German
    by the faculty, accounts are issued through the faculty's own contact page, and no vendor
    software, contract or host is involved. Note that the five removed SLUB contracts wrongly
    carried this host as their baseURL; it belongs only to this surface.
  description: >-
    A gated JSON API over the public data of the TU Dresden lecture directory — courses, seminars,
    instructors, buildings, semesters, institutes and degree programmes. Access requires an API
    account requested through the faculty contact page, after which an auth_code query parameter
    is appended to every call; the documentation asks for at least ten seconds between requests.
    The documented parameters are notitle, type, gebaeude, first_name plus last_name, datetype
    (including a discordian calendar option), pruefungen with studiengang, semester (accepting
    "current"), and institut, along with gebaeude_liste, dozenten_liste and institute_liste
    enumerations. Responses are JSON with the first element carrying column headings. Verified
    live and validating: a request with auth_code=test returns HTTP 200 and the plain-text German
    string "Der Auth-Code ist leider nicht richtig." No OpenAPI exists for it and none has been
    authored here — writing one from a prose parameter table would credit TU Dresden with a
    contract it has not published. The faculty scope is a real limit: this is one faculty's
    timetable, not a university-wide registrar API.
