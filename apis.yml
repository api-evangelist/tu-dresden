- aid: tu-dresden:qucosa-oai
  name: Qucosa TU Dresden OAI-PMH (Institutional Document Server)
  x-operator: tenant
  x-operator-evidence: >-
    tud.qucosa.de is a TU-Dresden-specific view on Qucosa, the Saxon document server operated by
    SLUB Dresden. The protocol response gives the operator away: the Identify envelope's request
    element names the backend http://sdvcmr-prod-oai01.slub-dresden.de:8080/oai/, repositoryName
    is "Qucosa" rather than anything TU Dresden, baseURL is http://www.qucosa.de/oai, adminEmail
    is qucosa-it@slub-dresden.de and repositoryIdentifier is qucosa.de. DataCite registers the
    matching client as tbyu.ozzulw, "Qucosa TU Dresden: Institutionelles Repositorium der
    Technischen Universität Dresden", under provider TBYU — Sächsische Landesbibliothek – Staats-
    und Universitätsbibliothek Dresden. The theses and open-access publications are TU Dresden's;
    the server, the software and the OAI implementation are SLUB's.
  description: >-
    The OAI-PMH 2.0 harvesting interface for the TU Dresden instance of Qucosa, the Saxon document
    and publication server used for dissertations, theses and open-access publications. Identify
    returns protocolVersion 2.0, earliestDatestamp 2010-06-09, deletedRecord persistent, deflate
    compression and an eprints description block. A real institutional fact and one of the few
    programmable surfaces the university has in this class — recorded as a tenancy rather than
    deleted, because the relationship is genuine even though the engineering is not TU Dresden's.
  humanURL: https://tud.qucosa.de/
  baseURL: https://tud.qucosa.de/oai/
