apis:
- aid: tu-dresden:tud-ai-llm
  name: TUD:AI LLM API
  x-operator: institution
  x-operator-evidence: >-
    The host is not on tu-dresden.de, so this needed settling on evidence rather than hostname.
    llm.scads.ai resolves to 141.76.18.84 and 141.76.19.193, inside the RIPE allocation
    141.76.0.0/16, netname TUDINF-LAN, org-name "Technische Universitaet Dresden" — TU Dresden's
    own address space, not a cloud tenancy. The service's own documentation states it is operated
    by ScaDS.AI Dresden/Leipzig and ZIH, the Center for Information Services and High Performance
    Computing at TU Dresden, and is "available to anyone affiliated with TU Dresden or ScaDS.AI
    Dresden/Leipzig". Keys are issued from the university's own Self-Service Portal at
    selfservice.tu-dresden.de, support runs to llm.scads.ai@tu-dresden.de, and the community
    channel is a Matrix room on tu-dresden.de. This is TU Dresden's engineering on TU Dresden's
    infrastructure. The CONTRACT, however, is not: https://llm.scads.ai/openapi.json is LiteLLM's
    generic proxy specification, info.title "LiteLLM API", identical to every other LiteLLM
    deployment. It is deliberately not saved to this repository — the deployment is TU Dresden's,
    the document is the product's.
  description: >-
    An OpenAI-compatible LLM inference API operated by ZIH and ScaDS.AI Dresden/Leipzig for TU
    Dresden staff, students and ScaDS.AI affiliates, served from a LiteLLM proxy on the
    university's own network. Per TU Dresden's documentation it fronts chat, audio generation and
    transcription, image generation, embedding and reranking models, addressed through model
    aliases for code, high-availability, image-generation, reasoning and vision. The published
    context-length table names nine chat models: deepseek-ai/DeepSeek-V4-Flash and
    zai-org/GLM-5.3-Flash at 1,048,576 tokens, MiniMaxAI/MiniMax-M3, MiniMaxAI/MiniMax-M3-MXFP8
    and zai-org/GLM-5.2-FP8 at 524,288, google/gemma-4-26B-A4B-it and Qwen/Qwen3.8-27B at 262,144,
    openai/gpt-oss-120b at 131,072 and meta-llama/Llama-3.3-70B-Instruct at 65,536. Keys minted
    through the Self-Service Portal carry a restrictive requests-per-minute default, raised on
    request. Verified live from outside the institution: GET /v1/models returns a LiteLLM
    auth_error envelope under HTTP 500 with no credential, and a materially different envelope
    naming a key hash when an invalid bearer token is presented, so the token is checked against a
    store. There is also a browser front end at chat.llm.scads.ai behind TUD account login. No
    OpenAPI is saved for this surface: the only contract served is LiteLLM's own, and crediting TU
    Dresden with it would repeat exactly the error this re-profile removed. This is the most
    consequential find of the pass — a German technical university running its own agent-facing
    inference API on its own hardware.
