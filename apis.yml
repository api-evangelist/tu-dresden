- aid: tu-dresden:sso-shibboleth
  name: TU Dresden Identity Provider (Shibboleth SAML 2.0 + OpenID Connect)
  x-operator: institution
  x-operator-evidence: >-
    Every endpoint in the published metadata is on idp.tu-dresden.de — the four SAML SSO bindings,
    the OIDC authorization, token and userinfo endpoints, and the JWKS. The entity is registered
    by DFN-AAI (registrationAuthority https://www.aai.dfn.de, registrationInstant 2021-04-21),
    declares shibmd:Scope tu-dresden.de, and carries mdui display names and an OrganizationURL of
    http://www.tu-dresden.de with contacts informationssicherheit@tu-dresden.de and
    servicedesk@tu-dresden.de. Unlike the hosted federation proxies common in this cohort, TU
    Dresden runs the software.
  description: >-
    The university's own Shibboleth identity provider, operated by ZIH, and the surface class this
    pipeline exists to surface: institution-operated by definition, fully machine-readable, and
    almost never catalogued. The SAML 2.0 metadata document at /idp/shibboleth carries an
    IDPSSODescriptor with four SingleSignOnService bindings — HTTP-POST, HTTP-POST-SimpleSign,
    HTTP-Redirect and SOAP ECP on port 8443 — plus four signing and encryption KeyDescriptors.
    REFEDS MET confirms the entity is exported from DFN-AAI into eduGAIN and republished by the
    InCommon, SWAMID and UK Access Management federations, and that it holds both the REFEDS
    Research and Scholarship entity category and SIRTFI. The same IdP now also speaks OpenID
    Connect, correcting the June 2026 profile which recorded OIDC as planned but unavailable:
    /.well-known/openid-configuration returns issuer https://idp.tu-dresden.de,
    response_types [code], grant_types [authorization_code], scopes [openid], four token-endpoint
    auth methods including private_key_jwt, and claims_supported carrying the eduPerson set —
    eduPersonPrincipalName, eduPersonScopedAffiliation, eduPersonAssurance and
    eduPersonEntitlement. /idp/profile/oidc/keyset serves a three-key JWKS.
