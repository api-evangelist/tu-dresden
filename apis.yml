  description: >-
    The DSpace 7.6.2 REST API of OPARA, the open-access research-data repository ZIH operates for
    TU Dresden and three further Saxon institutions. The HAL root at /server/api is served
    anonymously and links roughly sixty resource families — communities, collections, items,
    bundles, bitstreams and bitstream formats under /core; a faceted discovery service under
    /discover with search/objects and browses; authentication and authorization under /authn and
    /authz; eperson and group administration; workflow and submission endpoints; external-source
    integration; and a Spring Boot actuator. Read access to public material needs no credential:
    /server/api/core/collections and /server/api/discover/search/objects both return live JSON
    unauthenticated. Deposits carry DataCite DOIs under TU Dresden's own prefix 10.25532, minted
    by client tib.zih, with the publisher field reading "Technische Universität Dresden". TU
    Dresden publishes no OpenAPI for it and none has been authored here; the contract shape is
    DSpace's upstream REST contract, which belongs in the DSpace project's own record.
