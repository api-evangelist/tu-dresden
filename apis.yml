  description: >-
    TU Dresden's research information system, a current-research-information-system tenancy on
    Elsevier Pure, published to the world as the TUD Research Portal at fis.tu-dresden.de. The
    public portal is fully browsable and answers 200. The programmable side is not reachable from
    the public internet: /ws/api, /ws/rest and /ws/oai?verb=Identify all return an Apache 403 —
    an edge denial ahead of any application authentication — so neither the Pure web service nor
    its OAI-PMH interface can be harvested from outside, and no metadata profile, set list or
    error envelope can be observed. Recorded as a real institutional surface with an honest
    ceiling: TU Dresden operates a CRIS, and none of it is machine-readable to the public.
  humanURL: https://fis.tu-dresden.de/portal/
  baseURL: https://fis.tu-dresden.de/ws/api
