  detail: >-
    TU Dresden operates five surfaces of its own and four of the five require an institutional
    credential, which is the normal shape for a German university and is a finding about the
    institution, not about us. Nothing blocked the probe: more than sixty hosts and paths were
    fetched successfully with a browser User-Agent, every status code below was observed live, and
    the thinness that remains is real. Verified institution-operated and live: TUD:AI at
    https://llm.scads.ai/v1/models answers with a LiteLLM auth_error envelope for a missing key
    and a DIFFERENT envelope naming a key hash for an invalid one, which proves the token is
    validated rather than merely required; llm.scads.ai resolves to 141.76.18.84 and
    141.76.19.193, inside the RIPE allocation 141.76.0.0/16 netname TUDINF-LAN, org "Technische
    Universitaet Dresden", and keys are issued from
    https://selfservice.tu-dresden.de/services/scads-llm-api/ with support at
    llm.scads.ai@tu-dresden.de. OPARA answers anonymously at
    https://opara.zih.tu-dresden.de/server/api with a DSpace 7.6.2 HAL root document and at
    /server/oai/request with a valid OAI-PMH 2.0 Identify naming adminEmail
    servicedesk@tu-dresden.de and twelve metadata prefixes. https://idp.tu-dresden.de/idp/shibboleth
    serves DFN-AAI-registered SAML metadata and /.well-known/openid-configuration plus
    /idp/profile/oidc/keyset now serve OIDC — correcting the June profile, which recorded OIDC as
    "planned but not yet available". https://vvz.phil.tu-dresden.de/api?auth_code=test returns
    "Der Auth-Code ist leider nicht richtig." under a 200. Verified live but tenant-operated:
    fis.tu-dresden.de is Elsevier Pure (a PureFacade marker in the portal HTML; /ws/api,
    /ws/oai and /ws/rest all answer 403 while /portal/ws/api answers 404), and
    https://tud.qucosa.de/oai/?verb=Identify returns an OAI-PMH envelope whose request element
    names the backend http://sdvcmr-prod-oai01.slub-dresden.de:8080/oai/ and whose adminEmail is
    qucosa-it@slub-dresden.de, with the DataCite client for it registered as tbyu.ozzulw under
    SLUB's provider TBYU. Removed as another institution's: the five SLUB LOD contracts at
    data.slub-dresden.de — SLUB is a Saxon state library that serves TU Dresden under agreement,
    it holds its own Crossref membership (26325) and its own DataCite provider symbol (TBYU), and
    its API is not TU Dresden's engineering. Not TU Dresden's either: OPAL at
    bildungsportal.sachsen.de, the Saxony-wide LMS run by BPS Bildungsportal Sachsen GmbH, and the
    Mensa API at studentenwerk-dresden.de, run by the student services organisation. Confirmed
    absent by DNS: data.tu-dresden.de, api.tu-dresden.de, opendata.tu-dresden.de,
    developer.tu-dresden.de, gitlab.tu-dresden.de, elearning.tu-dresden.de, status.tu-dresden.de,
    chat.zih.tu-dresden.de and ki.tu-dresden.de all fail to resolve. Confirmed absent by fetch:
    https://tu-dresden.de/llms.txt 404, https://llm.scads.ai/v1/openapi.json 404, and
    github.com/tu-dresden holds a single repository. The one contract that is publicly served —
    https://llm.scads.ai/openapi.json — is LiteLLM's own generic proxy specification, titled
    "LiteLLM API", and is deliberately not saved here for the same reason the SLUB contracts were
    removed.
