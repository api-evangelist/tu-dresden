description: >-
  TU Dresden is a non-commercial higher-education institution; its APIs are not sold
  as a commercial product. Public APIs (library, repository, course, and open-metadata
  interfaces) are offered free of charge, typically for non-commercial use. Most
  administrative and identity APIs are not openly self-service and require institutional
  affiliation, credentials, or federation membership rather than a paid plan.
notes: >-
  Reconfirmed 2026-08-30. No published per-seat or per-call commercial pricing anywhere in the
  footprint. "Free / Open" reflects the genuinely open endpoints — the OPARA DSpace REST API and
  both OAI-PMH interfaces, all of which answer anonymously. "Affiliation / Credentialed" reflects
  access gated by institutional identity rather than payment, which covers TUD:AI (keys issued
  from the university Self-Service Portal to TU Dresden and ScaDS.AI affiliates only, metered by
  a requests-per-minute cap rather than by price), the gated lecture-catalog auth_code, and the
  Pure web service. There is no paid tier and no public signup on any surface.
