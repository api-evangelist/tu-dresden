openapi: 3.0.3
info:
  title: LOD authority_search source API
  version: '1.0'
  description: Linked Open Data API published by the Saxony State and University Library (SLUB Dresden), which serves TU Dresden. Provides bibliographic and authority data (resources, persons, organizations, events, topics, works, geo) aggregated from K10Plus/SWB, GND and Wikidata, with search, source, reconcile and entity-lookup endpoints. Converted faithfully from the publicly served Swagger 2.0 document at https://data.slub-dresden.de/swagger.json
servers:
- url: https://data.slub-dresden.de
tags:
- name: source
  description: Source data access operation
paths:
  /source/{source_index}/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: The ID-String of the entity to access.
      schema:
        type: string
    - name: source_index
      in: path
      required: true
      description: 'The name of the source-index to access the source-data. Allowed Values: [''kxp-de14'', ''swb-aut'', ''gnd_marc21'']'
      schema:
        type: string
    get:
      tags:
      - source
      operationId: getSourceRecord
      responses:
        '200':
          description: Success
        '404':
          description: Record(s) not found
